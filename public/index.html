<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Web</title>
<style>
  :root {
    --bg: #1a1a1e;
    --panel: #232329;
    --border: #3a3a42;
    --text: #e8e8ea;
    --dim: #9a9aa5;
    --accent: #d97757;
    --user-bg: #2d3a4a;
    --tool-bg: #2a2a33;
    --error: #e06c75;
    --ok: #98c379;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; gap: 8px; align-items: center; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header .logo { font-weight: bold; color: var(--accent); margin-right: 8px; }
  header input, header select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  #cwd { width: 340px; }
  header button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; max-width: 900px; width: 100%;
    margin: 0 auto;
  }
  .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 14px; }
  .msg.user { background: var(--user-bg); align-self: flex-end; max-width: 80%; }
  .msg.assistant { background: var(--panel); align-self: flex-start; max-width: 95%; }
  .msg.thinking { color: var(--dim); font-style: italic; background: none; padding: 4px 14px; font-size: 13px; }
  .tool {
    align-self: flex-start; background: var(--tool-bg); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; max-width: 95%; overflow: hidden;
  }
  .tool summary { padding: 6px 12px; cursor: pointer; color: var(--dim); }
  .tool summary .name { color: var(--accent); font-weight: bold; }
  .tool pre { margin: 0; padding: 8px 12px; overflow-x: auto; font-size: 12px; color: var(--dim); border-top: 1px solid var(--border); }
  .msg.error { background: none; color: var(--error); font-size: 13px; padding: 4px 14px; }
  .msg.meta { background: none; color: var(--dim); font-size: 12px; padding: 2px 14px; align-self: center; }
  footer {
    padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto;
  }
  #prompt {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 200px;
  }
  footer button { border: none; border-radius: 8px; padding: 0 18px; cursor: pointer; font-size: 14px; }
  #send { background: var(--accent); color: #fff; }
  #stop { background: var(--border); color: var(--text); display: none; }
  /* 権限確認モーダル */
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 10;
  }
  #modal .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: min(560px, 90vw); max-height: 80vh; overflow-y: auto;
  }
  #modal h3 { margin: 0 0 10px; font-size: 15px; }
  #modal .toolname { color: var(--accent); }
  #modal pre { background: var(--bg); padding: 10px; border-radius: 8px; font-size: 12px; overflow-x: auto; max-height: 300px; }
  #modal .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  #allow { background: var(--ok); color: #1a1a1e; border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer; font-weight: bold; }
  #deny { background: var(--error); color: #1a1a1e; border: none; border-radius: 8px; padding: 8px 20px; cursor: pointer; font-weight: bold; }
  .spinner { color: var(--dim); font-size: 13px; padding: 4px 14px; align-self: flex-start; }
</style>
</head>
<body>
<header>
  <span class="logo">⌘ Claude Web</span>
  <input id="cwd" placeholder="作業ディレクトリ (例: /Users/you/project)">
  <select id="permMode">
    <option value="default">default（都度確認）</option>
    <option value="acceptEdits">acceptEdits（編集は自動許可）</option>
    <option value="plan">plan（計画のみ）</option>
  </select>
  <button id="newSession">新規セッション</button>
  <span id="status">未接続</span>
</header>

<div id="chat"></div>

<footer>
  <textarea id="prompt" placeholder="Claude Codeへの指示を入力… (Cmd+Enterで送信)"></textarea>
  <button id="send">送信</button>
  <button id="stop">中断</button>
</footer>

<div id="modal">
  <div class="box">
    <h3>🔒 ツール実行の許可: <span class="toolname" id="modalTool"></span></h3>
    <pre id="modalInput"></pre>
    <div class="btns">
      <button id="deny">拒否</button>
      <button id="allow">許可</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");
const statusEl = document.getElementById("status");
const cwdEl = document.getElementById("cwd");
const permModeEl = document.getElementById("permMode");
const modal = document.getElementById("modal");

let ws = null;
let blocks = {};          // index -> { el, kind, jsonBuf }
let currentPermId = null;
let totalCost = 0;
let spinnerEl = null;

cwdEl.value = localStorage.getItem("claude-web-cwd") || "";

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { statusEl.textContent = "接続済み"; };
  ws.onclose = () => { statusEl.textContent = "切断（リロードで再接続）"; setRunning(false); };
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function send(obj) { ws?.send(JSON.stringify(obj)); }

function addEl(tag, className, text) {
  const el = document.createElement(tag);
  el.className = className;
  if (text != null) el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function showSpinner() {
  removeSpinner();
  spinnerEl = addEl("div", "spinner", "考え中…");
}
function removeSpinner() { spinnerEl?.remove(); spinnerEl = null; }

function setRunning(running) {
  sendBtn.style.display = running ? "none" : "";
  stopBtn.style.display = running ? "" : "none";
  if (!running) removeSpinner();
}

function handleMessage(msg) {
  switch (msg.type) {
    case "init":
      statusEl.textContent = `${msg.model} | ${msg.cwd} | $${totalCost.toFixed(4)}`;
      break;

    case "block_start": {
      removeSpinner();
      const b = msg.block;
      if (b.type === "text") {
        blocks[msg.index] = { kind: "text", el: addEl("div", "msg assistant", "") };
      } else if (b.type === "thinking") {
        blocks[msg.index] = { kind: "thinking", el: addEl("div", "msg thinking", "") };
      } else if (b.type === "tool_use") {
        const details = document.createElement("details");
        details.className = "tool";
        details.innerHTML = `<summary>🔧 <span class="name"></span></summary><pre></pre>`;
        details.querySelector(".name").textContent = b.name;
        chat.appendChild(details);
        chat.scrollTop = chat.scrollHeight;
        blocks[msg.index] = { kind: "tool", el: details, jsonBuf: "" };
      }
      break;
    }

    case "text_delta": {
      const block = blocks[msg.index];
      if (block) { block.el.textContent += msg.text; chat.scrollTop = chat.scrollHeight; }
      break;
    }

    case "thinking_delta": {
      const block = blocks[msg.index];
      if (block) { block.el.textContent += msg.text; chat.scrollTop = chat.scrollHeight; }
      break;
    }

    case "tool_input_delta": {
      const block = blocks[msg.index];
      if (block?.kind === "tool") block.jsonBuf += msg.partial;
      break;
    }

    case "block_stop": {
      const block = blocks[msg.index];
      if (block?.kind === "tool") {
        let pretty = block.jsonBuf;
        try { pretty = JSON.stringify(JSON.parse(block.jsonBuf || "{}"), null, 2); } catch {}
        block.el.querySelector("pre").textContent = pretty;
        showSpinner(); // ツール実行中の表示
      }
      delete blocks[msg.index];
      break;
    }

    case "permission_request": {
      currentPermId = msg.id;
      document.getElementById("modalTool").textContent = msg.toolName;
      document.getElementById("modalInput").textContent = JSON.stringify(msg.input, null, 2);
      modal.style.display = "flex";
      break;
    }

    case "permission_cancelled":
      if (currentPermId === msg.id) { modal.style.display = "none"; currentPermId = null; }
      break;

    case "tool_error":
      addEl("div", "msg error", `⚠ ツールエラー: ${msg.text}`);
      break;

    case "result": {
      totalCost += msg.costUsd || 0;
      const parts = statusEl.textContent.split(" | ");
      if (parts.length === 3) { parts[2] = `$${totalCost.toFixed(4)}`; statusEl.textContent = parts.join(" | "); }
      addEl("div", "msg meta", `完了 (${msg.numTurns}ターン / $${(msg.costUsd || 0).toFixed(4)} / ${((msg.durationMs || 0) / 1000).toFixed(1)}s)`);
      setRunning(false);
      blocks = {};
      break;
    }

    case "error":
      addEl("div", "msg error", `エラー: ${msg.message}`);
      setRunning(false);
      break;

    case "session_closed":
      addEl("div", "msg meta", "セッション終了");
      setRunning(false);
      break;
  }
}

function sendPrompt() {
  const text = promptEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  localStorage.setItem("claude-web-cwd", cwdEl.value.trim());
  addEl("div", "msg user", text);
  send({
    type: "user_message",
    text,
    cwd: cwdEl.value.trim() || undefined,
    permissionMode: permModeEl.value,
  });
  promptEl.value = "";
  setRunning(true);
  showSpinner();
}

sendBtn.onclick = sendPrompt;
promptEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendPrompt(); }
});

stopBtn.onclick = () => send({ type: "interrupt" });

document.getElementById("allow").onclick = () => {
  send({ type: "permission_response", id: currentPermId, behavior: "allow" });
  modal.style.display = "none"; currentPermId = null;
};
document.getElementById("deny").onclick = () => {
  send({ type: "permission_response", id: currentPermId, behavior: "deny" });
  modal.style.display = "none"; currentPermId = null;
};

document.getElementById("newSession").onclick = () => location.reload();

connect();
</script>
</body>
</html>
